<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Pertinentia EC0301 y EC0217.01</title>
    <meta name="description" content="Establece una nueva contraseña segura para tu cuenta PertinentIA y vuelve a acceder a tu Fábrica de Productos EC0301.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://app.pertinentia.com/reset-password">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/login" class="nav-brand" style="text-decoration:none;">Pertinentia <span>EC0301</span></a>
    </nav>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Nueva Contraseña</h1>
            <p class="auth-subtitle">Ingresa tu nueva contraseña.</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash-msg flash-{{ category }}" style="margin-bottom:1rem;">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                        <button type="button" class="eye-toggle" onclick="toggleEye(this)" aria-label="Mostrar contraseña">&#128065;</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password2">Confirmar contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password2" name="password2" required placeholder="Repite tu contraseña" autocomplete="new-password">
                        <button type="button" class="eye-toggle" onclick="toggleEye(this)" aria-label="Mostrar contraseña">&#128065;</button>
                    </div>
                </div>
                <button type="submit" class="auth-btn">Guardar Nueva Contraseña</button>
            </form>
            <p class="auth-link" style="margin-top:1rem;">
                <a href="/login">Volver a Iniciar Sesión</a>
            </p>
        </div>
    </div>
    <script>
    function toggleEye(btn) {
        var input = btn.previousElementSibling;
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '&#128064;';
        } else {
            input.type = 'password';
            btn.innerHTML = '&#128065;';
        }
    }
    </script>
</body>
</html>
